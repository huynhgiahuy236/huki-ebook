# ========================================================
# HUKI EBOOK - UAT NGINX REVERSE PROXY CONFIGURATION
# Serves UAT Stack: huki-uat.duckdns.org / localhost
# ========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name huki-uat.duckdns.org localhost 127.0.0.1;

    # Re-resolve Docker service IPs dynamically whenever UAT containers recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 100M;

    # Health check probe for container
    location /nginx-health {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # API Gateway UAT routing
    location /api/ {
        set $api_upstream http://api-gateway-uat:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Socket.IO WebSocket routing (handles with or without trailing slash)
    location /socket.io {
        set $community_upstream http://community-service-uat:3005;
        proxy_pass $community_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Next.js UAT Web routing
    location / {
        set $web_upstream http://web-uat:3100;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

