# Grafana Tempo Docker Compose Configuration
version: '3.8'

services:
  # ============================================
  # Tempo - Distributed Tracing Backend
  # ============================================
  tempo:
    image: grafana/tempo:2.3.0
    container_name: huki-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"     # tempo
      - "4317:4317"    # otlp grpc
      - "4318:4318"    # otlp http
      - "14268:14268"  # jaeger thrift http
    volumes:
      - ./tempo-config.yml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - huki-network
    restart: unless-stopped

volumes:
  tempo_data:

networks:
  huki-network:
    external: true
    name: huki-network
