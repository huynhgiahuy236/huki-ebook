  - name: Chat
    description: Real-time chat
  - name: Notifications
    description: User notifications
  - name: Moderation
    description: Content moderation
  - name: Vouchers
    description: Voucher management
  - name: Banners
    description: Banner management
  - name: Flash Sales
    description: Flash sale management
  - name: Search
    description: Catalog search

paths:
  # ============================================
  # HEALTH
  # ============================================
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API Gateway
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  # ============================================
  # AUTH
  # ============================================
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      description: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: Password123
                fullName:
                  type: string
                  example: Nguyen Van A
                phone:
                  type: string
                  example: "0912345678"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticate user and get tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Logout and revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logout successful

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh token
      description: Get new access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Get profile of authenticated user
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Forgot password
      description: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /auth/change-password:
    patch:
      tags:
        - Auth
      summary: Change password
      description: Change password while logged in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed

  # ============================================
  # USERS
  # ============================================
  /users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
        - Users
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                avatar:
                  type: string
      responses:
        '200':
          description: Profile updated

  # ============================================
  # SESSIONS
  # ============================================
  /sessions:
    get:
      tags:
        - Sessions
      summary: Get all sessions
      description: List all active sessions for the user
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
    delete:
      tags:
        - Sessions
      summary: Revoke all sessions except current
      responses:
        '200':
          description: Sessions revoked

  /sessions/{sessionId}:
    delete:
      tags:
        - Sessions
      summary: Revoke specific session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked

  # ============================================
  # BUSINESS
  # ============================================
  /businesses:
    get:
      tags:
        - Business
      summary: List all businesses
      description: Public endpoint to list businesses
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, SUSPENDED]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of businesses
    post:
      tags:
        - Business
      summary: Register business
      description: Register a new business (userId as query param)
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusiness'
      responses:
        '201':
          description: Business registered

  /businesses/my:
    get:
      tags:
        - Business
      summary: Get my business
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: My business

  /businesses/{id}:
    get:
      tags:
        - Business
      summary: Get business by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Business details
    patch:
      tags:
        - Business
      summary: Update business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusiness'
      responses:
        '200':
          description: Business updated

  /businesses/{id}/approve:
    post:
      tags:
        - Business
      summary: Approve business
      description: Admin endpoint to approve a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: adminId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Business approved

  /businesses/{id}/reject:
    post:
      tags:
        - Business
      summary: Reject business
      description: Admin endpoint to reject a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: adminId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Business rejected

  # ============================================
  # STORES
  # ============================================
  /stores:
    get:
      tags:
        - Stores
      summary: List all stores
      description: Public endpoint
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of stores
    post:
      tags:
        - Stores
      summary: Create store
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStore'
      responses:
        '201':
          description: Store created

  /stores/my:
    get:
      tags:
        - Stores
      summary: Get my stores
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: My stores

  /stores/slug/{slug}:
    get:
      tags:
        - Stores
      summary: Get store by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Store details

  /stores/{id}:
    get:
      tags:
        - Stores
      summary: Get store by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Store details
    patch:
      tags:
        - Stores
      summary: Update store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStore'
      responses:
        '200':
          description: Store updated
    delete:
      tags:
        - Stores
      summary: Delete store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Store deleted

  # ============================================
  # MEMBERS
  # ============================================
  /businesses/{businessId}/members/invite:
    post:
      tags:
        - Members
      summary: Invite member
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [OWNER, ADMIN, EDITOR, VIEWER]
      responses:
        '201':
          description: Invitation sent

  /businesses/{businessId}/members:
    get:
      tags:
        - Members
      summary: Get all members
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of members

  /businesses/{businessId}/members/{memberId}/role:
    patch:
      tags:
        - Members
      summary: Update member role
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
        - name: adminId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [OWNER, ADMIN, EDITOR, VIEWER]
      responses:
        '200':
          description: Role updated

  /businesses/{businessId}/members/{memberId}:
    delete:
      tags:
        - Members
      summary: Remove member
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
        - name: adminId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed

  /businesses/{businessId}/leave:
    post:
      tags:
        - Members
      summary: Leave business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Left business

  # ============================================
  # BOOKS
  # ============================================
  /books:
    get:
      tags:
        - Books
      summary: List published books
      description: Public endpoint - list all published books with filters
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: categoryId
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: string
        - name: storeId
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [PHYSICAL, DIGITAL, BOTH]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, price, viewCount]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of books
    post:
      tags:
        - Books
      summary: Create book
      description: Create a new book draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBook'
      responses:
        '201':
          description: Book created

  /books/slug/{slug}:
    get:
      tags:
        - Books
      summary: Get book by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details

  /books/{id}:
    get:
      tags:
        - Books
      summary: Get book by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book details
    patch:
      tags:
        - Books
      summary: Update book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBook'
      responses:
        '200':
          description: Book updated
    delete:
      tags:
        - Books
      summary: Delete book
      description: Soft delete a book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Book deleted

  /books/{bookId}/publish:
    post:
      tags:
        - Books
      summary: Publish book
      description: Change book status to PUBLISHED
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book published

  /books/{bookId}/hide:
    post:
      tags:
        - Books
      summary: Hide book
      description: Change book status to HIDDEN
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book hidden

  /books/{bookId}/archive:
    post:
      tags:
        - Books
      summary: Archive book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book archived

  /books/{bookId}/suspend:
    post:
      tags:
        - Books
      summary: Suspend book
      description: Platform admin action to suspend a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book suspended

  /books/{bookId}/physical:
    get:
      tags:
        - Books
      summary: Get physical details
      description: Get private physical details for owned book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Physical details
    patch:
      tags:
        - Books
      summary: Update physical details
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock:
                  type: integer
                weight:
                  type: number
                dimensions:
                  type: string
                pageCount:
                  type: integer
      responses:
        '200':
          description: Physical details updated

  /books/{bookId}/digital:
    get:
      tags:
        - Books
      summary: Get digital details
      description: Get digital metadata (without private keys)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Digital details
    patch:
      tags:
        - Books
      summary: Update digital details
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                digitalEnabled:
                  type: boolean
                allowOnlineRead:
                  type: boolean
                allowDownload:
                  type: boolean
      responses:
        '200':
          description: Digital details updated

  /books/{bookId}/inventory:
    patch:
      tags:
        - Books
      summary: Update inventory
      description: Adjust stock with audit log
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adjustment:
                  type: integer
                  description: Positive to add, negative to subtract
                reason:
                  type: string
      responses:
        '200':
          description: Inventory updated

  # ============================================
  # UPLOADS
  # ============================================
  /books/{bookId}/cover:
    post:
      tags:
        - Books
      summary: Upload cover image
      description: Upload cover image to Cloudinary
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cover:
                  type: string
                  format: binary
      responses:
        '200':
          description: Cover uploaded

  /books/{bookId}/file:
    post:
      tags:
        - Books
      summary: Upload source PDF
      description: Upload private source PDF to R2
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
