  - name: Categories
    description: Book categories
  - name: Authors
    description: Book authors
  - name: Publishers
    description: Book publishers
  - name: Cart
    description: Shopping cart operations
  - name: Checkout
    description: Order checkout
  - name: Orders
    description: Order management (buyer view)
  - name: Seller Orders
    description: Order management (seller view)
  - name: Payments
    description: Payment and refund operations
  - name: Shipping
