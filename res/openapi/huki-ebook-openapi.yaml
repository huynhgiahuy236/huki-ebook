# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ============================================
    # COMMON SCHEMAS
    # ============================================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
        avatar:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userAgent:
          type: string
        ipAddress:
          type: string
        isCurrent:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
              description: Access token expiry in seconds

    # ============================================
    # BUSINESS SCHEMAS
    # ============================================
    CreateBusiness:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        description:
          type: string
        logo:
          type: string
        taxCode:
          type: string

    UpdateBusiness:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        description:
          type: string
        logo:
          type: string

    CreateStore:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        logo:
          type: string
        banner:
          type: string

    UpdateStore:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        logo:
          type: string
        banner:
          type: string
        isActive:
          type: boolean

    # ============================================
    # BOOK SCHEMAS
    # ============================================
    CreateBook:
      type: object
      required:
        - title
        - slug
        - description
        - price
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        format:
          type: string
          enum: [PHYSICAL, DIGITAL, BOTH]
          default: PHYSICAL
        categoryId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        publisherId:
          type: string
          format: uuid
        isbn:
          type: string
        coverUrl:
          type: string

    UpdateBook:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        salePrice:
          type: number
        categoryId:
          type: string
        authorId:
          type: string
        publisherId:
          type: string
        isbn:
          type: string

    # ============================================
    # SHIPPING SCHEMAS
    # ============================================
    ShippingAddress:
      type: object
      required:
        - name
        - phone
        - province
        - district
        - ward
        - street
      properties:
        name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0912345678"
        province:
          type: string
          example: Ho Chi Minh
        district:
          type: string
          example: District 1
        ward:
          type: string
          example: Ben Nghe
        street:
          type: string
          example: 123 Nguyen Hue St
        note:
          type: string
          example: Leave at door

    # ============================================
    # PROMOTION SCHEMAS
    # ============================================
    CreateVoucher:
      type: object
      required:
        - code
        - type
        - value
      properties:
        code:
          type: string
          example: DISCOUNT10
        type:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        value:
          type: number
          description: Percentage (1-100) or fixed amount
        minOrderAmount:
          type: number
          description: Minimum order amount to apply
        maxDiscount:
          type: number
          description: Maximum discount cap
        usageLimit:
          type: integer
          description: Total usage limit
        perUserLimit:
          type: integer
          default: 1
        startsAt:
          type: string
          format: date-time
        expiresAt:
