openapi: 3.0.4
info:
  title: HUKI EBOOK API
  description: |
    # HUKI EBOOK Platform API Documentation

    Welcome to the HUKI EBOOK API documentation. This API provides comprehensive endpoints for managing a multi-vendor ebook platform.

    ## 🎯 Overview

    HUKI EBOOK is a microservices-based ebook platform supporting:
    - **Multi-vendor bookstores**: Sellers can create their own stores
    - **Physical & Digital books**: Support for both formats
    - **Subscription model**: Free, Basic, Premium tiers
    - **Real-time chat**: Buyer-seller communication
    - **Community features**: Forums, reviews, ratings

    ## 🔐 Authentication

    All protected endpoints require JWT Bearer token authentication:

    1. **Register**: `POST /api/v1/auth/register`
    2. **Login**: `POST /api/v1/auth/login` → Returns `accessToken` and `refreshToken`
    3. **Use Token**: Include header `Authorization: Bearer <accessToken>`

    ## 📍 Base URL

    - Local: `http://localhost:3000/api/v1`
    - Development: `https://dev.huki.ebook.com/api/v1`

    ## 📋 Services Architecture

    | Service | Port | Description |
    |---------|------|-------------|
    | API Gateway | 3000 | Entry point, routes to microservices |
    | Identity | 3001 | Authentication, Users, Sessions |
    | Business | 3002 | Businesses, Stores, Members |
    | Commerce | 3003 | Books, Cart, Orders, Payments |
    | Shipping | 3004 | Shipments, Addresses, GHTK |
    | Community | 3005 | Forum, Chat, Reviews, Notifications |
    | Promotion | 3007 | Vouchers, Banners, Flash Sales |

    ## ❌ Error Codes

    | Code | Meaning |
    |------|---------|
    | 400 | Bad Request - Invalid input |
    | 401 | Unauthorized - Token invalid/expired |
    | 403 | Forbidden - No permission |
    | 404 | Not Found - Resource doesn't exist |
    | 409 | Conflict - Duplicate entry |
    | 500 | Internal Server Error |

    ## 📝 Common Headers

    | Header | Required | Description |
    |--------|----------|-------------|
    | Content-Type | Yes | `application/json` |
    | Authorization | For protected routes | `Bearer <token>` |
    | Idempotency-Key | For checkout | UUID for idempotent operations |

    ## 🔄 Pagination

    List endpoints support pagination:

    ```
    GET /resource?page=1&limit=20
    GET /resource?cursor=<lastId>&limit=20
    ```

    Response format:
    ```json
    {
      "data": [...],
      "meta": {
        "page": 1,
        "limit": 20,
        "total": 100,
        "totalPages": 5
      }
    }
    ```
