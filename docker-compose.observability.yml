# ========================================================
# HUKI EBOOK - Observability Stack
# Prometheus, Loki, Promtail, Tempo, Grafana
# ========================================================

services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: huki-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./platform/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - huki-network

  loki:
    image: grafana/loki:2.9.2
    container_name: huki-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - huki-network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: huki-promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - huki-network

  tempo:
    image: grafana/tempo:2.3.1
    container_name: huki-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # tempo HTTP
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
    networks:
      - huki-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: huki-grafana
    restart: unless-stopped
    ports:
      - "3101:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3101
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - huki-network
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus_data:
    name: huki-prometheus-data
  loki_data:
    name: huki-loki-data
  tempo_data:
    name: huki-tempo-data
  grafana_data:
    name: huki-grafana-data

networks:
  huki-network:
    external: true
    name: huki-network
