# ========================================================
# HUKI EBOOK - UAT / Staging Environment Stack
# Runs alongside Production on the same VPS
# Domain: https://huki-uat.duckdns.org
# ========================================================

name: huki-uat

services:
  # ============================================
  # UAT BACKEND MICROSERVICES
  # ============================================
  api-gateway-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-api-gateway
    restart: unless-stopped
    command: ["node", "dist/out-tsc/api-gateway/apps/api-gateway/src/main.js"]
    environment:
      PORT: 3000
      API_GATEWAY_PORT: 3000
      NODE_ENV: staging
      IDENTITY_SERVICE_HOST: identity-service-uat
      IDENTITY_SERVICE_PORT: 3001
      BUSINESS_SERVICE_HOST: business-service-uat
      BUSINESS_SERVICE_PORT: 3002
      COMMERCE_SERVICE_HOST: commerce-service-uat
      COMMERCE_SERVICE_PORT: 3003
      PROMOTION_SERVICE_HOST: promotion-service-uat
      PROMOTION_SERVICE_PORT: 3007
      SHIPPING_SERVICE_HOST: shipping-service-uat
      SHIPPING_SERVICE_PORT: 3004
      COMMUNITY_SERVICE_HOST: community-service-uat
      COMMUNITY_SERVICE_PORT: 3005
      ANALYTICS_SERVICE_HOST: analytics-service-uat
      ANALYTICS_SERVICE_PORT: 3008
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      CORS_ORIGIN: https://huki-uat.duckdns.org,http://localhost:3100,http://103.67.197.73
      CORS_ORIGINS: https://huki-uat.duckdns.org,http://localhost:3100,http://103.67.197.73
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      identity-service-uat:
        condition: service_started
      business-service-uat:
        condition: service_started
      commerce-service-uat:
        condition: service_started
      shipping-service-uat:
        condition: service_started
      community-service-uat:
        condition: service_started
      promotion-service-uat:
        condition: service_started
      analytics-service-uat:
        condition: service_started
    networks:
      - huki-network

  identity-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-identity-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/identity-service/apps/identity-service/src/main.js"]
    environment:
      PORT: 3001
      IDENTITY_SERVICE_PORT: 3001
      NODE_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: huki_uat_identity
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_identity?schema=public
      IDENTITY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_identity?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-https://huki-uat.duckdns.org}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://huki-uat.duckdns.org/api/v1/auth/google/callback}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      DRM_MAX_ACTIVE_DEVICES: 5
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  business-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-business-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/business-service/apps/business-service/src/main.js"]
    environment:
      PORT: 3002
      BUSINESS_SERVICE_PORT: 3002
      NODE_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: huki_uat_business
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_business?schema=public
      BUSINESS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_business?schema=public
      IDENTITY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_identity?schema=public
      COMMERCE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_commerce?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  commerce-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-commerce-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/commerce-service/apps/commerce-service/src/main.js"]
    environment:
      PORT: 3003
      COMMERCE_SERVICE_PORT: 3003
      NODE_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: huki_uat_commerce
      PROMOTION_SERVICE_URL: http://promotion-service-uat:3007
      PROMOTION_SERVICE_HOST: promotion-service-uat
      PROMOTION_SERVICE_PORT: 3007
      SHIPPING_SERVICE_URL: http://shipping-service-uat:3004
      SHIPPING_SERVICE_HOST: shipping-service-uat
      SHIPPING_SERVICE_PORT: 3004
      BUSINESS_SERVICE_URL: http://business-service-uat:3002
      BUSINESS_SERVICE_HOST: business-service-uat
      BUSINESS_SERVICE_PORT: 3002
      BUSINESS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_business?schema=public
      CHECKOUT_SESSION_TTL_MINUTES: ${CHECKOUT_SESSION_TTL_MINUTES:-15}
      CHECKOUT_SHIPPING_BASE_FEE: ${CHECKOUT_SHIPPING_BASE_FEE:-25000}
      BOOK_COVER_MAX_BYTES: ${BOOK_COVER_MAX_BYTES:-5242880}
      BOOK_PDF_MAX_BYTES: ${BOOK_PDF_MAX_BYTES:-104857600}
      ORDER_PAYMENT_TTL_SECONDS: ${ORDER_PAYMENT_TTL_SECONDS:-900}
      MERCHANT_DISPATCH_DEADLINE_HOURS: ${MERCHANT_DISPATCH_DEADLINE_HOURS:-48}
      AUTO_CANCEL_ON_DISPATCH_TIMEOUT: ${AUTO_CANCEL_ON_DISPATCH_TIMEOUT:-true}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-10}
      PLATFORM_VOUCHER_SUBSIDY_RATE: ${PLATFORM_VOUCHER_SUBSIDY_RATE:-100}
      SHIPPING_PRICING_MODEL: ${SHIPPING_PRICING_MODEL:-TIERED}
      FEATURE_COIN_ENABLED: ${FEATURE_COIN_ENABLED:-true}
      COMMISSION_CALCULATION_BASIS: ${COMMISSION_CALCULATION_BASIS:-NET_SALES}
      VAT_INVOICE_MODE: ${VAT_INVOICE_MODE:-ENABLED}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_commerce?schema=public
      COMMERCE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_commerce?schema=public
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-huki-ebooks}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  shipping-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-shipping-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/shipping-service/apps/shipping-service/src/main.js"]
    environment:
      PORT: 3004
      SHIPPING_SERVICE_PORT: 3004
      NODE_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: huki_uat_shipping
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_shipping?schema=public
      SHIPPING_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_shipping?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  community-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-community-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/community-service/apps/community-service/src/main.js"]
    environment:
      PORT: 3005
      COMMUNITY_SERVICE_PORT: 3005
      NODE_ENV: staging
      MONGODB_URI: mongodb://mongo:27017/community_uat_db
      COMMERCE_SERVICE_URL: http://commerce-service-uat:3003
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  promotion-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-promotion-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/promotion-service/apps/promotion-service/src/main.js"]
    environment:
      PORT: 3007
      PROMOTION_SERVICE_PORT: 3007
      NODE_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: huki_uat_promotion
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_promotion?schema=public
      PROMOTION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_promotion?schema=public
      BUSINESS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_business?schema=public
      COMMERCE_SERVICE_URL: http://commerce-service-uat:3003
      COMMERCE_SERVICE_HOST: commerce-service-uat
      COMMERCE_SERVICE_PORT: 3003
      BUSINESS_SERVICE_URL: http://business-service-uat:3002
      IDENTITY_SERVICE_URL: http://identity-service-uat:3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  analytics-service-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-platform:uat
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-uat-analytics-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/analytics-service/apps/analytics-service/src/main.js"]
    environment:
      PORT: 3008
      ANALYTICS_SERVICE_PORT: 3008
      NODE_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: huki_uat_analytics
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_analytics?schema=public
      ANALYTICS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_analytics?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  # ============================================
  # UAT FRONTEND WEB APPLICATION
  # ============================================
  web-uat:
    image: ${DOCKERHUB_USERNAME:-huynhgiahuy1506}/huki-web:uat
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: huki-uat-web
    restart: unless-stopped
    environment:
      PORT: 3100
      NODE_ENV: staging
      API_GATEWAY_URL: http://api-gateway-uat:3000
      NEXT_PUBLIC_GATEWAY_URL: https://huki-uat.duckdns.org
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_SITE_URL: https://huki-uat.duckdns.org
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      NEXT_PUBLIC_SOCKET_URL: https://huki-uat.duckdns.org
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.0}
    ports:
      - "127.0.0.1:3110:3100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health?probe=live"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway-uat:
        condition: service_healthy
    networks:
      - huki-network

  nginx-uat:
    image: nginx:alpine
    container_name: huki-uat-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/nginx/uat-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway-uat:
        condition: service_started
      web-uat:
        condition: service_started
    networks:
      - huki-network

networks:
  huki-network:
    external: true

