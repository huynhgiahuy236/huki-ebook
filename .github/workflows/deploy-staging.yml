name: Deploy backend to Staging Environment

on:
  push:
    branches:
      - develop
    paths:
      - "platform/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Pre-deployment compile check
        working-directory: platform
        run: |
          npm ci
          npm run prisma:generate
          npm run build

      - name: Deploy to Staging Host
        if: ${{ env.STAGING_EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          STAGING_EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20

            cd "/home/${{ secrets.STAGING_EC2_USER }}/huki-staging/platform"
            git fetch origin develop
            git reset --hard origin/develop

            npm ci
            npm run prisma:generate
            npm run build
            npm run prisma:migrate:deploy

            for process in api-gateway identity-service business-service commerce-service shipping-service community-service promotion-service analytics-service; do
              pm2 restart "staging-$process" --update-env || pm2 start "dist/out-tsc/$process/apps/$process/src/main.js" --name "staging-$process" --update-env
            done

            sleep 10
            curl --fail --silent http://127.0.0.1:4000/api/v1/health/live >/dev/null
