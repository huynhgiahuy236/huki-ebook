name: Deploy UAT to VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger UAT Deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '103.67.197.73' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -e
            echo "=== [1/4] Pulling latest code on develop branch ==="
            cd /root/huki
            git fetch origin develop
            git checkout develop
            git pull origin develop

            echo "=== [2/4] Ensuring Infrastructure is healthy ==="
            docker compose -f docker-compose.prod.yml up -d postgres mongo redis rabbitmq
            sleep 5

            echo "=== [3/4] Rebuilding and updating UAT services with Docker Compose ==="
            docker compose -f docker-compose.uat.yml up -d --build --remove-orphans

            echo "=== [4/4] Verifying UAT health routes ==="
            sleep 15
            curl --fail --retry 5 --retry-delay 5 http://127.0.0.1:3010/api/v1/health/live || echo "UAT API Gateway health check warning"

            echo "=== Cleaning up dangling images ==="
            docker image prune -f

            echo "=== UAT Deployment Complete! ==="
            docker compose -f docker-compose.uat.yml ps
