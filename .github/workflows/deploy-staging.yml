name: Deploy UAT to VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend Platform
            context: ./platform
            image: huki-platform
          - name: Frontend Web
            context: ./web
            image: huki-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:uat
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-uat:
    name: Deploy UAT Stack on VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Pull and Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: 'root'
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 35m
          script: |
            set -e
            echo "=== [0/5] Checking and maintaining disk space on VPS ==="
            df -h
            # Clean dangling images and builder cache
            docker image prune -f || true
            docker builder prune -f || true
            journalctl --vacuum-size=100M 2>/dev/null || true
            rm -rf /tmp/* /var/tmp/* 2>/dev/null || true
            echo "--- Disk space status ---"
            df -h

            echo "=== [1/5] Pulling latest code on develop branch ==="
            cd /root/huki
            git fetch origin develop
            git checkout develop
            git pull origin develop

            echo "=== Loading environment variables from /root/huki/.env ==="
            if [ -f /root/huki/.env ]; then
              set -a
              . /root/huki/.env
              set +a
              echo "Loaded .env successfully"
            else
              echo "WARNING: /root/huki/.env not found"
            fi

            echo "=== [2/5] Ensuring Infrastructure is healthy ==="
            docker compose -f docker-compose.prod.yml up -d postgres mongo redis rabbitmq
            echo "Restarting PostgreSQL to clear any out-of-disk crash lock..."
            docker restart huki-postgres || true
            sleep 3

            set +e
            PG_READY=0
            for i in $(seq 1 30); do
              if docker exec huki-postgres pg_isready -U postgres; then
                echo "PostgreSQL is ready!"
                PG_READY=1
                break
              fi
              echo "Waiting for PostgreSQL to be ready ($i/30)..."
              docker logs --tail 3 huki-postgres 2>/dev/null || true
              sleep 5
            done

            # If still not ready after 150s, try one clean container restart
            if [ "$PG_READY" -ne 1 ]; then
              echo "PostgreSQL not ready, attempting container restart..."
              docker restart huki-postgres
              for i in $(seq 1 20); do
                if docker exec huki-postgres pg_isready -U postgres; then
                  echo "PostgreSQL is ready after restart!"
                  PG_READY=1
                  break
                fi
                echo "Waiting for PostgreSQL to be ready after restart ($i/20)..."
                docker logs --tail 3 huki-postgres 2>/dev/null || true
                sleep 5
              done
            fi
            set -e

            if [ "$PG_READY" -ne 1 ]; then
              echo "Error: PostgreSQL failed to become ready in time"
              docker logs --tail 100 huki-postgres
              exit 1
            fi

            echo "=== Ensuring UAT databases exist in PostgreSQL ==="
            for db in huki_uat_identity huki_uat_business huki_uat_commerce huki_uat_shipping huki_uat_promotion huki_uat_analytics; do
              docker exec huki-postgres psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 || docker exec huki-postgres psql -U postgres -c "CREATE DATABASE $db;"
            done

            echo "=== Migrating huki_uat_promotion schema if needed ==="
            docker exec huki-postgres psql -U postgres -d huki_uat_promotion -tc "SELECT 1 FROM information_schema.tables WHERE table_name = 'vouchers'" | grep -q 1 || {
              echo "Applying base promotion migrations..."
              docker exec -i huki-postgres psql -U postgres -d huki_uat_promotion < /root/huki/platform/apps/promotion-service/prisma/migrations/20260817135338_init/migration.sql
              docker exec -i huki-postgres psql -U postgres -d huki_uat_promotion < /root/huki/platform/apps/promotion-service/prisma/migrations/20260824062827_init_promotions/migration.sql
              docker exec -i huki-postgres psql -U postgres -d huki_uat_promotion < /root/huki/platform/apps/promotion-service/prisma/migrations/20260916073000_add_flash_sale_banner/migration.sql
            }
            docker exec -i huki-postgres psql -U postgres -d huki_uat_promotion < /root/huki/platform/apps/promotion-service/prisma/migrations/20261105000000_add_voucher_target_audience/migration.sql || true
            docker exec -i huki-postgres psql -U postgres -d huki_uat_promotion < /root/huki/platform/apps/promotion-service/prisma/migrations/20261106000000_add_outbox_audit_saved/migration.sql || true

            echo "=== Ensuring All Personas (Admin, Buyer, Seller, Shipper, Affiliate) in UAT Databases ==="
            # 1. Platform Admin
            docker exec huki-postgres psql -U postgres -d huki_uat_identity -c "
            UPDATE users SET
              password_hash = '\$2b\$10\$3.001gBlBckzv1qwvJnYceUA0HR.bq4F8BitNqAgpQJn.18YdzHA2',
              role = 'PLATFORM_ADMIN',
              status = 'ACTIVE',
              failed_login_attempts = 0,
              locked_until = NULL
            WHERE email = 'admin@huki.com';
            " || true

            # 2. Buyer (Customer)
            docker exec huki-postgres psql -U postgres -d huki_uat_identity -c "
            INSERT INTO users (id, email, password_hash, full_name, role, status, email_verified_at, created_at, updated_at)
            VALUES (
              'usr0-0000-4000-8000-000000000001',
              'user@huki.com',
              '\$2b\$10\$dCdBeQfdlNrBzY54SCvJlOnLb2nmgmjIhQ6VKY9BX9BVUhcywHKd.',
              'Nguyễn Văn An (Test Buyer)',
              'USER',
              'ACTIVE',
              NOW(),
              NOW(),
              NOW()
            )
            ON CONFLICT (email) DO UPDATE SET
              password_hash = EXCLUDED.password_hash,
              role = 'USER',
              status = 'ACTIVE',
              failed_login_attempts = 0,
              locked_until = NULL;
            " || true

            # 3. Seller (Business Owner)
            docker exec huki-postgres psql -U postgres -d huki_uat_identity -c "
            INSERT INTO users (id, email, password_hash, full_name, role, status, email_verified_at, created_at, updated_at)
            VALUES (
              'biz0-0000-4000-8000-000000000002',
              'business@huki.com',
              '\$2b\$10\$NaWzVxF1mnKkhaswyxfNTe/UGi39vJb.iEStyGcGvy.vMAtlchb0u',
              'Alpha Books Official (Test Business)',
              'BUSINESS',
              'ACTIVE',
              NOW(),
              NOW(),
              NOW()
            )
            ON CONFLICT (email) DO UPDATE SET
              password_hash = EXCLUDED.password_hash,
              role = 'BUSINESS',
              status = 'ACTIVE',
              failed_login_attempts = 0,
              locked_until = NULL;
            " || true

            # 4. Shipper (Delivery Staff)
            docker exec huki-postgres psql -U postgres -d huki_uat_identity -c "
            INSERT INTO users (id, email, password_hash, full_name, role, status, email_verified_at, created_at, updated_at)
            VALUES (
              'ship-0000-4000-8000-000000000003',
              'shipper@huki.com',
              '\$2b\$10\$Sa1J5hTAqN5.PX9PG75IR.ClAgV3VJnDgXOCTeNvoftZED8Vi18lG',
              'Nguyễn Văn Giao (Shipper HUKI)',
              'DELIVERY_STAFF',
              'ACTIVE',
              NOW(),
              NOW(),
              NOW()
            )
            ON CONFLICT (email) DO UPDATE SET
              password_hash = EXCLUDED.password_hash,
              role = 'DELIVERY_STAFF',
              status = 'ACTIVE',
              failed_login_attempts = 0,
              locked_until = NULL;
            " || true
            docker exec huki-postgres psql -U postgres -d huki_uat_shipping -c "
            INSERT INTO delivery_staff (id, user_id, name, phone, email, status, current_area, created_at, updated_at)
            VALUES ('staff-shipper-01', 'ship-0000-4000-8000-000000000003', 'Nguyễn Văn Giao (Shipper HUKI)', '0908889999', 'shipper@huki.com', 'ACTIVE', 'TP. Hồ Chí Minh', NOW(), NOW())
            ON CONFLICT (user_id) DO UPDATE SET status = 'ACTIVE';
            " || true

            # 5. Affiliate Partner (CTV)
            docker exec huki-postgres psql -U postgres -d huki_uat_identity -c "
            INSERT INTO users (id, email, password_hash, full_name, role, status, email_verified_at, created_at, updated_at)
            VALUES (
              'aff0-0000-4000-8000-000000000004',
              'affiliate@huki.com',
              '\$2b\$10\$L7/9PwmX0JVu/Oahi13CfuaVpsbEyjF6rmDFaKuT77/3pNMd42KBq',
              'Trần Review Sách (Top KOC)',
              'USER',
              'ACTIVE',
              NOW(),
              NOW(),
              NOW()
            )
            ON CONFLICT (email) DO UPDATE SET
              password_hash = EXCLUDED.password_hash,
              status = 'ACTIVE',
              failed_login_attempts = 0,
              locked_until = NULL;
            " || true
            docker exec huki-postgres psql -U postgres -d huki_uat_commerce -c "
            INSERT INTO affiliate_profiles (id, user_id, affiliate_code, display_name, contact_email, applicant_type, promotion_description, status, version, created_at, updated_at)
            VALUES ('aff-profile-01', 'aff0-0000-4000-8000-000000000004', 'HUKI_KOC_2026', 'Trần Review Sách (Top KOC)', 'affiliate@huki.com', 'INDIVIDUAL', 'Review sách và tạo link tiếp thị', 'ACTIVE', 1, NOW(), NOW())
            ON CONFLICT (user_id) DO UPDATE SET status = 'ACTIVE';
            " || true

            echo "=== [3/5] Pulling latest pre-built images from Docker Hub ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || true
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat"
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/huki-web:uat"

            echo "=== Syncing UAT database schemas with Prisma ==="
            docker run --rm \
              --network huki-network \
              -e COMMERCE_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_commerce?schema=public" \
              -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_commerce?schema=public" \
              "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat" \
              npx prisma db push --schema=apps/commerce-service/prisma/schema.prisma --skip-generate --accept-data-loss || echo "Commerce prisma push completed"

            docker run --rm \
              --network huki-network \
              -e SHIPPING_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_shipping?schema=public" \
              -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_shipping?schema=public" \
              "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat" \
              npx prisma db push --schema=apps/shipping-service/prisma/schema.prisma --skip-generate --accept-data-loss || echo "Shipping prisma push completed"

            docker run --rm \
              --network huki-network \
              -e IDENTITY_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_identity?schema=public" \
              -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_identity?schema=public" \
              "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat" \
              npx prisma db push --schema=apps/identity-service/prisma/schema.prisma --skip-generate --accept-data-loss || echo "Identity prisma push completed"

            docker run --rm \
              --network huki-network \
              -e BUSINESS_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_business?schema=public" \
              -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_business?schema=public" \
              "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat" \
              npx prisma db push --schema=apps/business-service/prisma/schema.prisma --skip-generate --accept-data-loss || echo "Business prisma push completed"

            docker run --rm \
              --network huki-network \
              -e PROMOTION_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_promotion?schema=public" \
              -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_promotion?schema=public" \
              "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat" \
              npx prisma db push --schema=apps/promotion-service/prisma/schema.prisma --skip-generate --accept-data-loss || echo "Promotion prisma push completed"

            docker run --rm \
              --network huki-network \
              -e ANALYTICS_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_analytics?schema=public" \
              -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/huki_uat_analytics?schema=public" \
              "${{ secrets.DOCKERHUB_USERNAME }}/huki-platform:uat" \
              npx prisma db push --schema=apps/analytics-service/prisma/schema.prisma --skip-generate --accept-data-loss || echo "Analytics prisma push completed"

            echo "=== [4/5] Starting UAT services ==="
            docker compose -f docker-compose.uat.yml up -d --remove-orphans
            docker restart huki-uat-promotion-service || true

            echo "=== [5/5] Verifying UAT health routes ==="
            sleep 30
            curl --fail --retry 5 --retry-delay 5 http://127.0.0.1:3010/api/v1/health/live || echo "UAT API Gateway health check warning"
            curl --fail --retry 5 --retry-delay 5 http://127.0.0.1:3010/api/v1/vouchers || echo "UAT Promotion Service health check warning"

            echo "=== Cleaning up dangling images ==="
            docker image prune -f

            echo "=== UAT Deployment Complete! ==="
            docker compose -f docker-compose.uat.yml ps
