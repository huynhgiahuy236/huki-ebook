name: Continuous Integration (CI) Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Backend Quality Gates (Build, Test, Contracts)
  # ========================================================
  backend-quality:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_MULTIPLE_DATABASES: huki_identity,huki_business,huki_commerce,huki_shipping,huki_promotion,huki_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest123
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install backend dependencies
        working-directory: platform
        run: npm ci

      - name: Generate Prisma clients
        working-directory: platform
        run: npm run prisma:generate

      - name: Compile backend microservices
        working-directory: platform
        run: npm run build

      - name: Run backend unit and contract tests
        working-directory: platform
        env:
          JWT_SECRET: ci-test-super-secret-jwt-key-minimum-32-chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-jwt-key-minimum-32-chars
          INTERNAL_SERVICE_KEY: ci-internal-service-key-test
        run: npm test -- --runInBand

  # ========================================================
  # Job 2: Frontend Quality Gates (Typecheck, Lint, Test, Build)
  # ========================================================
  frontend-quality:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend lint and TypeScript typecheck
        working-directory: web
        run: npm run check

      - name: Run frontend unit & component tests
        working-directory: web
        run: npm test

      - name: Run production Next.js build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ========================================================
  # Job 3: OpenAPI Schema & Migration Integrity
  # ========================================================
  schema-and-migration-integrity:
    name: Schema & Migration Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Validate all Prisma schemas format and validity
        working-directory: platform
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            echo "Validating $schema..."
            npx prisma validate --schema "$schema"
          done
