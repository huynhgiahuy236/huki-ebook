name: Deploy backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "platform"
          target: "/home/${{ secrets.EC2_USER }}/huki"
          overwrite: true

      - name: Build and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: Cannot find $NVM_DIR/nvm.sh" >&2
              exit 1
            fi
            . "$NVM_DIR/nvm.sh"
            nvm use 20
            set -u

            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "PM2: $(pm2 --version)"

            cd "/home/${{ secrets.EC2_USER }}/huki/platform"

            npm ci
            npm run prisma:generate
            npm run build

            mkdir -p node_modules/@huki
            ln -sfn ../../dist/libs/shared node_modules/@huki/shared

            for service in identity-service business-service commerce-service shipping-service promotion-service
            do
              mkdir -p "dist/out-tsc/$service/apps/$service/prisma"
              cp -a "apps/$service/prisma/generated" "dist/out-tsc/$service/apps/$service/prisma/"
            done

            npm run prisma:migrate:deploy

            for process in api-gateway identity-service business-service commerce-service shipping-service community-service promotion-service
            do
              pm2 restart "$process" --update-env
            done

            sleep 10
            curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3005/api/v1/health >/dev/null
            pm2 save
            pm2 status
