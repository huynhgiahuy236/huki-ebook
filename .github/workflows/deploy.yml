name: Deploy Production to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Trigger Production Deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: 'root'
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -e
            echo "=== [1/4] Pulling latest code on main branch ==="
            cd /root/huki
            git fetch origin main
            git checkout main
            git pull origin main

            echo "=== [2/4] Ensuring Infrastructure is healthy ==="
            docker compose -f docker-compose.prod.yml up -d postgres mongo redis rabbitmq
            sleep 5

            echo "=== [3/4] Rebuilding and updating services with Docker Compose ==="
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "=== [4/4] Verifying health routes ==="
            sleep 15
            curl --fail --retry 5 --retry-delay 5 http://127.0.0.1:3000/api/v1/health/live || echo "API Gateway health check warning"
            curl --fail --retry 5 --retry-delay 5 http://127.0.0.1:3100/api/health?probe=live || echo "Web health check warning"

            echo "=== Cleaning up dangling images ==="
            docker image prune -f

            echo "=== Production Deployment Complete! ==="
            docker compose -f docker-compose.prod.yml ps
