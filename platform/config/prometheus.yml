global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'  # AlertManager

rule_files:
  - '/etc/prometheus/rules/*.yml'
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  # API Gateway
  - job_name: 'huki-api-gateway'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Identity Service
  - job_name: 'huki-identity-service'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Business Service
  - job_name: 'huki-business-service'
    static_configs:
      - targets: ['localhost:3002']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Commerce Service
  - job_name: 'huki-commerce-service'
    static_configs:
      - targets: ['localhost:3003']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Shipping Service
  - job_name: 'huki-shipping-service'
    static_configs:
      - targets: ['localhost:3004']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Community Service
  - job_name: 'huki-community-service'
    static_configs:
      - targets: ['localhost:3005']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Promotion Service
  - job_name: 'huki-promotion-service'
    static_configs:
      - targets: ['localhost:3006']
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  # Web Frontend (optional - if has metrics)
  # - job_name: 'huki-web'
  #   static_configs:
  #     - targets: ['localhost:3100']
  #   metrics_path: /api/metrics
