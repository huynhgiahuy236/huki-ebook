# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'HUKI Dashboards'
    orgId: 1
    folder: 'HUKI EBOOK'
    folderUid: 'huki-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
