{key:'Mở đầu',hero:1,title:'HUKI <span class="accent">EBOOK</span>',lead:'Sàn thương mại điện tử đa doanh nghiệp hỗ trợ mua, bán và đọc sách trực tuyến',body:`<div class="keys"><div class="key"><b>01</b><br>Sàn TMĐT</div><div class="key"><b>02</b><br>Thị trường sách</div><div class="key"><b>03</b><br>Tiếp cận khách hàng</div><div class="key"><b>04</b><br>Microservices</div><div class="key"><b>05</b><br>Công nghệ & API</div></div>`,note:'Mở bằng bài toán, không mở bằng danh sách công nghệ.'},
{key:'Yêu cầu',eyebrow:'ĐỀ BÀI CỦA GIẢNG VIÊN',title:'Báo cáo phải đi từ <span class="accent">tìm hiểu</span> đến <span class="orange">hình dung sản phẩm</span>',body:`<div class="flow"><div class="step"><b>1. Tìm hiểu</b><small>Sàn TMĐT và thị trường sách online</small></div><div class="step"><b>2. Quan sát</b><small>Các nền tảng hiện có đang làm gì</small></div><div class="step"><b>3. Xác định</b><small>Khoảng trống và bài toán cần giải quyết</small></div><div class="step"><b>4. Đề xuất</b><small>HUKI cần làm gì, tiếp cận khách ra sao</small></div><div class="step"><b>5. Hiện thực</b><small>Microservices, frontend, backend, DB, API</small></div></div><div class="callout" style="margin-top:18px"><b>Nguyên tắc:</b> công nghệ chỉ xuất hiện sau khi đã chỉ ra vấn đề nó giải quyết.</div>`,note:'Slide này chứng minh bài làm bám đúng yêu cầu thầy đưa.'},
{key:'Bản đồ',eyebrow:'BẢN ĐỒ NỘI DUNG',title:'Năm key, một <span class="accent">mạch lập luận</span>',body:`<div class="grid g3"><article class="card"><span class="tag">Key 1</span><h3>Mô hình sàn</h3><p>Ai tham gia? HUKI khác website bán sách thế nào?</p></article><article class="card"><span class="tag">Key 2</span><h3>Bài toán thị trường</h3><p>Người đọc, nhà sách và sàn đang gặp khó khăn gì?</p></article><article class="card"><span class="tag">Key 3</span><h3>Tìm đến khách hàng</h3><p>Cá nhân hóa, AI, ranking, review và marketing.</p></article><article class="card"><span class="tag">Key 4</span><h3>Microservices</h3><p>Kiến trúc nào vận hành được các nghiệp vụ?</p></article><article class="card"><span class="tag">Key 5</span><h3>Công nghệ & API</h3><p>Frontend, backend, database và kết nối ngoài.</p></article><article class="card idea"><h3>Kết quả</h3><p>Một hình dung sản phẩm HUKI đủ rõ để triển khai.</p></article></div>`},

{key:'Key 1',eyebrow:'KEY 1 • HUKI LÀ GÌ?',title:'Một marketplace, nhưng có <span class="accent">hai vòng đời sản phẩm</span>',body:`<div class="grid g2"><article class="card idea"><span class="tag orange">Sách vật lý</span><h3>Mua → giao → nhận</h3><ul><li>Có SKU, tồn kho và địa điểm xuất hàng.</li><li>Một giỏ có thể tách thành nhiều đơn shop.</li><li>Phát sinh phí vận chuyển, đổi trả và khiếu nại.</li></ul></article><article class="card solution"><span class="tag">Ebook</span><h3>Mua → cấp quyền → đọc</h3><ul><li>Không giao file công khai; cấp entitlement cho tài khoản.</li><li>Lưu tiến trình và bookmark theo tài khoản.</li><li>Quyền đọc/đọc thành tiếng phụ thuộc chính sách NXB.</li></ul></article><div class="callout" style="grid-column:1/-1"><b>Định vị:</b> HUKI kết hợp marketplace sách với trải nghiệm đọc số trên web, thay vì chỉ là website bán sách.</div></div>`},
{key:'Key 1',eyebrow:'KEY 1 • QUAN SÁT SÀN THỰC TẾ',title:'Mỗi nền tảng giải một phần của <span class="accent">bức tranh</span>',body:`<div class="matrix"><div class="head">Nền tảng</div><div class="head">Điểm quan sát được</div><div class="head">Bài học cho HUKI</div><div class="label">Tiki</div><div class="muted">Shop riêng, lượt bán, chấm sao, giá, thời gian giao và danh sách bán chạy.</div><div class="muted">Trust + fulfillment phải hiện ngay nơi ra quyết định.</div><div class="label">Fahasa.com</div><div class="muted">Catalog sách chuyên sâu, category, ấn bản giới hạn và giao tận nơi.</div><div class="muted">Metadata ngành sách cần sâu hơn sàn tổng hợp.</div><div class="label">Amazon / Kindle</div><div class="muted">Marketplace lớn kết hợp hệ sinh thái ebook và DRM.</div><div class="muted">Quyền nội dung phải được quản lý như một nghiệp vụ.</div><div class="label">Google Play Books</div><div class="muted">Đọc ebook và Read Aloud; nhà xuất bản quyết định sách nào được phép.</div><div class="muted">AI đọc sách phải tôn trọng quyền và định dạng nội dung.</div></div>`,note:'Đây là quan sát từ trang công khai; không khẳng định thuật toán nội bộ của nền tảng.'},
{key:'Key 2',chapter:1,eyebrow:'KEY 2 • THỊ TRƯỜNG SÁCH ONLINE',title:'Vấn đề không phải là <span class="accent">thiếu sách</span>',lead:'Vấn đề là khó xác định đúng ấn bản, đúng nhà bán, đúng nhu cầu và đúng quyền sử dụng.',body:`<div class="grid g4"><article class="card problem"><h3>Phân mảnh</h3><p>Sách nằm ở nhiều website, shop và kênh mạng xã hội.</p></article><article class="card problem"><h3>Khó chuẩn hóa</h3><p>ISBN, lần tái bản, dịch giả, bìa, combo và định dạng.</p></article><article class="card problem"><h3>Niềm tin</h3><p>Sách giả/in lậu, review thiếu tin cậy và seller không rõ nguồn gốc.</p></article><article class="card problem"><h3>Khó khám phá</h3><p>Người đọc biết nhu cầu nhưng không nhớ tên cuốn sách.</p></article></div>`},
{key:'Key 2',eyebrow:'KEY 2 • BÀI TOÁN BA PHÍA',title:'Một sản phẩm tốt phải giải quyết <span class="accent">đồng thời</span>',body:`<div class="grid g3"><article class="card"><span class="tag">Người đọc</span><ul><li>Tìm đúng sách và đúng phiên bản.</li><li>Tin shop, đánh giá và nguồn sách.</li><li>Mua, đọc và nghe trực tiếp trên website.</li></ul></article><article class="card"><span class="tag orange">Nhà sách / NXB</span><ul><li>Tiếp cận đúng nhóm độc giả.</li><li>Quản lý catalog và bán đa định dạng.</li><li>Nhận phản hồi có thể hành động.</li></ul></article><article class="card"><span class="tag blue">Đơn vị vận hành</span><ul><li>Kiểm soát seller và nội dung.</li><li>Xếp hạng công bằng, chống thao túng.</li><li>Cân bằng doanh thu với trải nghiệm.</li></ul></article></div>`},
{key:'Key 2',eyebrow:'KEY 2 • DỮ LIỆU SÁCH',title:'Muốn tìm kiếm tốt, phải mô hình hóa đúng <span class="accent">“cuốn sách”</span>',body:`<div class="flow"><div class="step"><b>Tác phẩm</b><small>Nội dung trí tuệ: tên, tác giả, chủ đề</small></div><div class="step"><b>Ấn bản</b><small>ISBN, NXB, dịch giả, năm, định dạng</small></div><div class="step"><b>Listing</b><small>Shop, giá, tồn, tình trạng và SLA</small></div><div class="step"><b>Entitlement</b><small>Ai được đọc ebook, trong điều kiện nào</small></div></div><div class="callout" style="margin-top:18px"><b>Giải quyết:</b> gộp listing cùng ấn bản để so sánh seller, nhưng không gộp nhầm các lần tái bản hoặc định dạng khác nhau.</div>`},
{key:'Key 2',eyebrow:'KEY 2 • HÌNH DUNG SẢN PHẨM',title:'HUKI tạo một hành trình <span class="accent">liền mạch</span>',body:`<div class="flow"><div class="step"><b>Khám phá</b><small>Chủ đề, xu hướng, cộng đồng</small></div><div class="step"><b>Tìm hiểu</b><small>Metadata, preview, AI tư vấn</small></div><div class="step"><b>Chọn seller</b><small>Giá, uy tín, giao hàng</small></div><div class="step"><b>Mua</b><small>Giỏ đa shop, payment</small></div><div class="step"><b>Đọc / nhận</b><small>Reader hoặc vận chuyển</small></div><div class="step"><b>Phản hồi</b><small>Review, community, tín hiệu mới</small></div></div>`},
{key:'Key 3',chapter:1,eyebrow:'KEY 3 • CÔNG NGHỆ TÌM ĐẾN KHÁCH HÀNG',title:'Đưa đúng sách đến đúng người, <span class="accent">đúng thời điểm</span>',lead:'Cá nhân hóa không bắt đầu bằng mô hình AI; nó bắt đầu bằng tín hiệu hành vi có mục đích và sự đồng ý của người dùng.',body:`<div class="grid g4"><article class="card"><h3>Thông tin đăng ký</h3><p>Thể loại quan tâm, mục tiêu đọc, ngôn ngữ.</p></article><article class="card"><h3>Lịch sử tìm kiếm</h3><p>Truy vấn, filter, kết quả đã mở hoặc bỏ qua.</p></article><article class="card"><h3>Hành vi mua</h3><p>Xem, yêu thích, giỏ hàng, mua và đánh giá.</p></article><article class="card"><h3>Hành vi đọc</h3><p>Tiến trình, hoàn thành và chủ đề đọc tiếp.</p></article></div>`},
{key:'Key 3',eyebrow:'KEY 3 • CÁ NHÂN HÓA',title:'Một chiến lược <span class="accent">ba tầng</span> thực tế',body:`<div class="grid g3"><article class="card solution"><span class="tag">Tầng 1 • Cold start</span><h3>Rule + Popular</h3><p>Dùng sở thích đăng ký, xu hướng theo thể loại và sách đang bán tốt.</p></article><article class="card solution"><span class="tag">Tầng 2 • Có hành vi</span><h3>Content-based</h3><p>So khớp tác giả, thể loại, mô tả và embedding với sách đã quan tâm.</p></article><article class="card solution"><span class="tag">Tầng 3 • Đủ dữ liệu</span><h3>Hybrid</h3><p>Kết hợp content, collaborative và business rule; đo bằng CTR/conversion.</p></article><div class="callout" style="grid-column:1/-1"><b>Thực tế:</b> Amazon Personalize mô tả recommendation dựa trên lịch sử tương tác, catalog, ranking cá nhân và business filters. HUKI áp dụng nguyên tắc này theo quy mô dữ liệu của mình.</div></div>`},
{key:'Key 3',eyebrow:'KEY 3 • AI TƯ VẤN CHỌN SÁCH',title:'Từ câu hỏi tự nhiên đến <span class="accent">danh sách có lý do</span>',body:`<div class="book"><div class="cover">HUKI<br>AI</div><div><p class="lead">“Tôi cần một cuốn nhập môn tài chính, dễ đọc, dưới 200.000đ và có ebook.”</p><div class="flow"><div class="step"><b>Hiểu ý định</b><small>Chủ đề, trình độ, giá, format</small></div><div class="step"><b>Truy xuất</b><small>Catalog + review + tồn kho</small></div><div class="step"><b>Xếp hạng</b><small>Phù hợp + uy tín + sẵn có</small></div><div class="step"><b>Giải thích</b><small>Vì sao đề xuất, dẫn nguồn</small></div></div></div></div><div class="callout" style="margin-top:18px"><b>Guardrail:</b> không bịa sách, giá hoặc quyền ebook; câu trả lời phải dựa trên dữ liệu catalog hiện hành.</div>`},
{key:'Key 3',eyebrow:'KEY 3 • TÌM KIẾM',title:'Search phải hiểu cả <span class="accent">từ khóa lẫn ý định</span>',body:`<div class="grid g2"><article class="card"><span class="tag">Lexical search</span><h3>Chính xác và có cấu trúc</h3><p>Title, ISBN, tác giả, NXB, dịch giả; filter giá, format, ngôn ngữ, rating.</p></article><article class="card"><span class="tag orange">Semantic search</span><h3>Hiểu nhu cầu mô tả</h3><p>“Sách chữa lành nhẹ nhàng cho người mới đi làm” vẫn tìm được kết quả phù hợp.</p></article><div class="callout" style="grid-column:1/-1"><b>Thiết kế đề xuất:</b> hybrid search lấy lexical làm nền tin cậy, semantic mở rộng recall, rồi rerank theo chất lượng và khả năng mua.</div></div>`},
{key:'Key 3',eyebrow:'KEY 3 • MARKETING ONLINE',title:'Marketing là một <span class="accent">vòng đời</span>, không phải gửi thông báo hàng loạt',body:`<div class="flow"><div class="step"><b>Acquire</b><small>SEO, social, referral, creator/book community</small></div><div class="step"><b>Activate</b><small>Onboarding sở thích, wishlist, sample</small></div><div class="step"><b>Convert</b><small>Giỏ hàng, voucher phù hợp, retarget</small></div><div class="step"><b>Retain</b><small>Reading streak, series mới, tác giả theo dõi</small></div><div class="step"><b>Refer</b><small>Deep link, mã giới thiệu, book club</small></div></div><div class="grid g3" style="margin-top:16px"><article class="card"><h3>Kênh sở hữu</h3><p>Push, email, in-app; cần consent và frequency cap.</p></article><article class="card"><h3>Kênh kiếm được</h3><p>Review, cộng đồng, chia sẻ trích dẫn hợp quyền.</p></article><article class="card"><h3>Đo lường</h3><p>CAC, activation, conversion, repeat purchase, opt-out.</p></article></div>`},
{key:'Key 3',eyebrow:'KEY 3 • SHOP NÀO ĐƯỢC LÊN TRANG ĐẦU?',title:'Ranking phải tối ưu <span class="accent">giá trị cho người đọc</span>, không chỉ doanh thu',body:`<div class="rank"><div class="card"><span class="tag orange">Cổng đủ điều kiện</span><ul><li>Đã xác minh seller.</li><li>Không vi phạm bản quyền/chính sách.</li><li>Tỷ lệ hủy và khiếu nại dưới ngưỡng.</li><li>Không có dấu hiệu gian lận review.</li></ul></div><div class="card"><span class="tag">Điểm đề xuất HUKI</span><div class="formula"><div class="bar"><b>Chất lượng</b><div class="track"><div class="fill" style="width:35%"></div></div><b>35%</b></div><div class="bar"><b>Fulfillment</b><div class="track"><div class="fill" style="width:25%"></div></div><b>25%</b></div><div class="bar"><b>Khách hàng</b><div class="track"><div class="fill" style="width:20%"></div></div><b>20%</b></div><div class="bar"><b>Chuyển đổi</b><div class="track"><div class="fill" style="width:10%"></div></div><b>10%</b></div><div class="bar"><b>Tươi mới</b><div class="track"><div class="fill" style="width:10%"></div></div><b>10%</b></div></div></div></div>`,note:'Tỷ trọng là đề xuất minh họa của HUKI, không phải thuật toán của Tiki/Amazon.'},
{key:'Key 3',eyebrow:'KEY 3 • AI ĐÁNH GIÁ SHOP QUA PHẢN HỒI',title:'Biến hàng nghìn review thành <span class="accent">tín hiệu có thể hành động</span>',body:`<div class="flow"><div class="step"><b>Thu nhận</b><small>Rating, text, ảnh, đơn đã mua</small></div><div class="step"><b>Làm sạch</b><small>Spam, trùng lặp, ngôn từ xấu</small></div><div class="step"><b>Phân tích</b><small>Sentiment + chủ đề + mức nghiêm trọng</small></div><div class="step"><b>Tổng hợp</b><small>Đóng gói, đúng sách, giao hàng, hỗ trợ</small></div><div class="step"><b>Hành động</b><small>Rank, cảnh báo, moderation, seller coaching</small></div></div><div class="grid g2" style="margin-top:16px"><article class="card solution"><h3>AI hỗ trợ</h3><p>Tóm tắt xu hướng và phát hiện bất thường để ưu tiên kiểm tra.</p></article><article class="card problem"><h3>Con người quyết định</h3><p>Không tự khóa shop chỉ vì sentiment; cần bằng chứng, ngưỡng và cơ chế khiếu nại.</p></article></div>`},
{key:'Ebook',chapter:1,eyebrow:'ĐỌC SÁCH TRỰC TUYẾN • TÀI KHOẢN ĐƯỢC PHÉP',title:'Thanh toán tạo <span class="accent">quyền đọc</span>, không tạo URL công khai',body:`<div class="flow"><div class="step"><b>Payment paid</b><small>Xác nhận giao dịch hợp lệ</small></div><div class="step"><b>Entitlement</b><small>User + edition + quyền + thời hạn</small></div><div class="step"><b>Reader token</b><small>Token ngắn hạn, đúng tài khoản</small></div><div class="step"><b>Content stream</b><small>Trang/chương cần đọc, không lộ object URL</small></div><div class="step"><b>Reading state</b><small>Tiến trình và bookmark trên website</small></div></div><div class="callout" style="margin-top:18px"><b>Thực tế ngành:</b> Kindle mô tả DRM là cơ chế giới hạn truy cập/copy; HUKI vẫn cần chính sách bản quyền với NXB, vì kỹ thuật không thay thế quyền pháp lý.</div>`},
{key:'Ebook',eyebrow:'AI ĐỌC SÁCH • TEXT-TO-SPEECH',title:'“AI đọc sách” phải có <span class="accent">quyền, định dạng và trải nghiệm</span>',body:`<div class="grid g3"><article class="card"><span class="tag">Điều kiện</span><h3>Nhà xuất bản cho phép</h3><p>Quyền đọc thành tiếng được lưu theo từng ấn bản; không mặc định áp dụng cho mọi ebook.</p></article><article class="card"><span class="tag orange">Xử lý</span><h3>Text flow → TTS</h3><p>Chuẩn hóa câu, ngôn ngữ, giọng, tốc độ; bỏ header/footer và chú thích không cần đọc.</p></article><article class="card"><span class="tag blue">Trải nghiệm web</span><h3>Đồng bộ đọc–nghe</h3><p>Highlight câu hiện tại, pause/resume, tốc độ và lưu vị trí.</p></article><div class="callout" style="grid-column:1/-1"><b>Đối chiếu:</b> Google Play Books cho thấy Read Aloud cần flowing text và quyền của nhà xuất bản; HUKI áp dụng nguyên tắc đó cho trình đọc web.</div></div>`},
{key:'Sản phẩm',eyebrow:'TỔNG HÌNH DUNG SẢN PHẨM',title:'HUKI là ba trải nghiệm nối với <span class="accent">một lõi dữ liệu</span>',body:`<div class="grid g3"><article class="card solution"><h3>Marketplace</h3><p>Catalog chuẩn hóa, shop, giá, tồn, order, payment và vận chuyển.</p></article><article class="card solution"><h3>Web Reading</h3><p>Entitlement, trình đọc web, TTS, tiến trình và bookmark.</p></article><article class="card solution"><h3>Discovery engine</h3><p>Search, recommendation, AI advisor, ranking, review intelligence.</p></article><div class="callout" style="grid-column:1/-1"><b>Lõi chung:</b> identity, book metadata, behavior events, policy và measurement.</div></div>`},
{key:'Key 4',chapter:1,eyebrow:'KEY 4 • MICROSERVICES',title:'Tách service theo <span class="accent">năng lực nghiệp vụ</span>',body:`<div class="arch"><div class="layer"><b>Web Application</b><p>Buyer · Seller · Admin · Reader</p></div><div class="arrow">→</div><div class="layer"><b>API Gateway</b><div class="services"><div class="service">Identity</div><div class="service">Business</div><div class="service">Commerce</div><div class="service">Shipping</div><div class="service">Community</div><div class="service">Promotion</div><div class="service">Discovery</div><div class="service">Reading</div><div class="service">Notification</div></div></div><div class="arrow">↔</div><div class="layer"><b>Platform</b><p>RabbitMQ<br>Redis<br>Object storage<br>Observability</p></div></div>`,note:'Discovery/Reading có thể khởi đầu là module rồi tách khi tải và đội ngũ đủ lớn.'},
{key:'Key 4',eyebrow:'KEY 4 • GIAO TIẾP SERVICE',title:'Đồng bộ để trả lời; bất đồng bộ để <span class="accent">phối hợp</span>',body:`<div class="grid g2"><article class="card"><span class="tag">HTTP API</span><h3>Cần kết quả ngay</h3><ul><li>Gateway xác thực và lấy catalog.</li><li>Commerce hỏi Shipping về phí.</li><li>Reader kiểm tra entitlement.</li></ul></article><article class="card"><span class="tag orange">RabbitMQ event</span><h3>Có thể hoàn tất sau</h3><ul><li><code>ORDER_PAID</code> → shipping/reading/notification.</li><li><code>BOOK_VIEWED</code> → behavior pipeline.</li><li><code>REVIEW_CREATED</code> → moderation/AI summary.</li></ul></article><div class="callout" style="grid-column:1/-1"><b>Đảm bảo:</b> consumer phải idempotent vì RabbitMQ có thể giao lại message; retry có giới hạn và lỗi vĩnh viễn vào DLQ.</div></div>`},
{key:'Key 5',chapter:1,eyebrow:'KEY 5 • FRONTEND, BACKEND, DATABASE',title:'Stack đi theo <span class="accent">đặc tính dữ liệu và trải nghiệm</span>',body:`<div class="matrix"><div class="head">Lớp</div><div class="head">Công nghệ</div><div class="head">Vai trò</div><div class="label">Frontend Web</div><div class="muted">Next.js, TypeScript, Tailwind, shadcn/ui</div><div class="muted">Storefront, seller/admin dashboard và trình đọc ebook trên web.</div><div class="label">Backend</div><div class="muted">NestJS, Nx, Prisma, Mongoose</div><div class="muted">Module/service nghiệp vụ, validation và integration.</div><div class="label">Data</div><div class="muted">PostgreSQL, MongoDB, Redis, pgvector</div><div class="muted">Transaction, community, cache và vector search.</div><div class="label">Platform</div><div class="muted">RabbitMQ, R2, Cloudinary, PayOS</div><div class="muted">Event, ebook, image và thanh toán.</div></div>`},
{key:'Key 5',eyebrow:'KEY 5 • API',title:'API là hợp đồng nối <span class="accent">sản phẩm với hệ sinh thái</span>',body:`<div class="grid g3"><article class="card"><span class="tag">Web client API</span><h3>Website HUKI</h3><p>Catalog, search, cart, order, reader và review; JWT và rate limit.</p></article><article class="card"><span class="tag orange">Partner API</span><h3>Seller / NXB</h3><p>Đồng bộ sách, tồn, giá, quyền ebook và báo cáo; API key/OAuth theo scope.</p></article><article class="card"><span class="tag blue">External API</span><h3>Dịch vụ ngoài</h3><p>PayOS, vận chuyển, email và storage; webhook phải ký và idempotent.</p></article><div class="callout" style="grid-column:1/-1"><b>Quản trị:</b> OpenAPI/Swagger, versioning, correlation ID, audit log và quota theo client.</div></div>`},
{key:'Lộ trình',eyebrow:'TỪ NGHIÊN CỨU ĐẾN TRIỂN KHAI',title:'Không làm tất cả cùng lúc: <span class="accent">giải đúng thứ tự</span>',body:`<div class="grid g3"><article class="card solution"><span class="tag">MVP</span><h3>Giao dịch đáng tin</h3><p>Seller, catalog, search cơ bản, cart/order/payment, entitlement và reader.</p></article><article class="card idea"><span class="tag orange">Giai đoạn 2</span><h3>Khám phá & tăng trưởng</h3><p>Hybrid search, recommendation, ranking, marketing automation và review summary.</p></article><article class="card"><span class="tag blue">Giai đoạn 3</span><h3>AI nâng cao</h3><p>AI advisor, TTS tự nhiên, experiment platform và tối ưu đa mục tiêu.</p></article></div>`},

const deck=document.querySelector('#deck');deck.innerHTML=report.slides.map((s,i)=>`<section class="slide${s.hero?' hero':''}${s.chapter?' chapter':''}" data-index="${i}" data-key="${s.key}" data-note="${(s.note||'').replaceAll('"','&quot;')}">${s.hero?`<div class="hero-copy"><div class="kicker">BÁO CÁO 5 KEY • NHÓM 1</div><h1>${s.title}</h1><p class="subtitle">${s.lead}</p></div>`:`<header><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}</header>`}<div>${s.body}</div></section>`).join('');
const slides=[...document.querySelectorAll('.slide')],count=slides.length;let current=report.start-1,touchX=0,notesOn=false;const clamp=n=>Math.max(0,Math.min(n,count-1));function show(n,hash=true){current=clamp(n);slides.forEach((s,i)=>{const a=i===current;s.classList.toggle('active',a);s.setAttribute('aria-hidden',!a)});now.textContent=current+1;total.textContent=count;bar.style.width=`${(current+1)/count*100}%`;prev.disabled=current===0;next.disabled=current===count-1;document.title=`${current+1}/${count} — ${slides[current].dataset.key} | HUKI`;notes.textContent=slides[current].dataset.note||'Không có ghi chú riêng cho slide này.';if(hash)history.replaceState(null,'',`#slide-${current+1}`);if(report.remember)localStorage.setItem('huki-light-slide',current)}function toggleOverview(force){const on=force??!document.documentElement.classList.contains('overview');document.documentElement.classList.toggle('overview',on);panelOverview.textContent=on?'Trở lại trình chiếu':'Xem tổng quan'}function toggleNotes(force){notesOn=force??!notesOn;notes.classList.toggle('show',notesOn);panelNotes.textContent=notesOn?'Ẩn ghi chú':'Hiện ghi chú'}function full(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);overview.onclick=()=>toggleOverview();panelOverview.onclick=()=>toggleOverview();panelNotes.onclick=()=>toggleNotes();fullscreen.onclick=full;settings.onclick=e=>{e.stopPropagation();panel.classList.toggle('open');settings.setAttribute('aria-expanded',panel.classList.contains('open'))};scale.oninput=e=>{document.documentElement.style.setProperty('--scale',e.target.value);localStorage.setItem('huki-light-scale',e.target.value)};document.onclick=e=>{if(!e.target.closest('.controls'))panel.classList.remove('open');const s=e.target.closest('.overview .slide');if(s){show(+s.dataset.index);toggleOverview(false)}};document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const a={ArrowRight:()=>show(current+1),PageDown:()=>show(current+1),' ':()=>show(current+1),ArrowLeft:()=>show(current-1),PageUp:()=>show(current-1),Home:()=>show(0),End:()=>show(count-1),o:()=>toggleOverview(),O:()=>toggleOverview(),n:()=>toggleNotes(),N:()=>toggleNotes(),f:full,F:full,Escape:()=>toggleOverview(false)};if(a[e.key]){e.preventDefault();a[e.key]()}});document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const d=touchX-e.changedTouches[0].clientX;if(Math.abs(d)>55)show(current+(d>0?1:-1))},{passive:true});window.addEventListener('hashchange',()=>{const m=location.hash.match(/slide-(\d+)/);if(m)show(+m[1]-1,false)});const savedScale=localStorage.getItem('huki-light-scale'),hash=location.hash.match(/slide-(\d+)/);if(savedScale){document.documentElement.style.setProperty('--scale',savedScale);scale.value=savedScale}show(hash?+hash[1]-1:+(localStorage.getItem('huki-light-slide')??current),!hash);
</script></body></html>
