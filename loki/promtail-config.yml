# Promtail Configuration for HUKI EBOOK
# https://grafana.com/docs/loki/latest/clients/promtail/

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s
    retry_backoff:
      initial_delay: 500ms
      max_delay: 5s
      max_retries: 10

scrape_configs:
  # ============================================
  # Docker Container Logs
  # ============================================
  - job_name: docker
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            tag: tag
      - json:
          expressions:
            container_name: container_name
            container_id: container_id
          source: tag
      - regex:
          expression: '(?P<container_name>.*)'
          source: container_name
      - labels:
          container_name:
          stream:
    docker:
      pipeline_stages:
        - json:
            expressions:
              log: log
              stream: stream
      - labels:
          stream:
    relabel_configs:
      - source_labels: ['__journal_container_name']
        target_label: container_name
      - source_labels: ['__journal_container_id']
        target_label: container_id

  # ============================================
  # Application Logs (JSON format)
  # ============================================
  - job_name: huki-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: huki-services
          __path__: /var/log/huki/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            trace_id: trace_id
            metadata: metadata
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - replace:
          expression: '"(.*)"'
          replace: '${1}'
          source: message

  # ============================================
  # Nginx/Reverse Proxy Logs
  # ============================================
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) - \S+ \[(?P<timestamp>[^\]]+)\] "(?P<request>[^"]*)" (?P<status>\d+) (?P<size>\d+)'
      - labels:
          ip:
          status:
          request:
      - timestamp:
          source: timestamp
          format: "02/Jan/2006:15:04:05 -0700"

  # ============================================
  # PostgreSQL Logs
  # ============================================
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+ \S+) \[(?P<pid>\d+)\] (?P<level>\w+): (?P<message>.*)'
      - labels:
          level:
          pid:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.000 MST"

  # ============================================
  # System Logs
  # ============================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
    pipeline_stages:
      - syslog:
          listen_address: tcp://0.0.0.0:1514
          listen_protocol: udp
          labels:
            job: system
