# ========================================================
# HUKI EBOOK - Production Docker Compose Stack
# Multi-service containerized architecture with health checks
# ========================================================

services:
  # ============================================
  # INFRASTRUCTURE DATABASES & BROKERS
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: huki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_MULTIPLE_DATABASES: huki_identity,huki_business,huki_commerce,huki_shipping,huki_promotion,huki_analytics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  mongo:
    image: mongo:6
    container_name: huki-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: community_db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  redis:
    image: redis:7-alpine
    container_name: huki-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: huki-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest123}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huki-network

  # ============================================
  # BACKEND MICROSERVICES
  # ============================================
  api-gateway:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-api-gateway
    restart: unless-stopped
    command: ["node", "dist/out-tsc/api-gateway/apps/api-gateway/src/main.js"]
    environment:
      PORT: 3000
      API_GATEWAY_PORT: 3000
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 3001
      BUSINESS_SERVICE_HOST: business-service
      BUSINESS_SERVICE_PORT: 3002
      COMMERCE_SERVICE_HOST: commerce-service
      COMMERCE_SERVICE_PORT: 3003
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_PORT: 3004
      COMMUNITY_SERVICE_HOST: community-service
      COMMUNITY_SERVICE_PORT: 3005
      PROMOTION_SERVICE_HOST: promotion-service
      PROMOTION_SERVICE_PORT: 3007
      ANALYTICS_SERVICE_HOST: analytics-service
      ANALYTICS_SERVICE_PORT: 3008
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-min-32-chars-key}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hukiebook.duckdns.org,http://localhost:3100}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hukiebook.duckdns.org,http://localhost:3100}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      identity-service:
        condition: service_started
      business-service:
        condition: service_started
      commerce-service:
        condition: service_started
    networks:
      - huki-network

  identity-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-identity-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/identity-service/apps/identity-service/src/main.js"]
    environment:
      PORT: 3001
      IDENTITY_SERVICE_PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: huki_identity
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_identity?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-https://hukiebook.duckdns.org}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://hukiebook.duckdns.org/api/v1/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-min-32-chars-key}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - huki-network

  business-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-business-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/business-service/apps/business-service/src/main.js"]
    environment:
      PORT: 3002
      BUSINESS_SERVICE_PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: huki_business
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_business?schema=public
      IDENTITY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_identity?schema=public
      BUSINESS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_business?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-token-key}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - huki-network

  commerce-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-commerce-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/commerce-service/apps/commerce-service/src/main.js"]
    environment:
      PORT: 3003
      COMMERCE_SERVICE_PORT: 3003
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: huki_commerce
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-huki-ebooks}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PROMOTION_SERVICE_URL: http://promotion-service:3007
      PROMOTION_SERVICE_HOST: promotion-service
      PROMOTION_SERVICE_PORT: 3007
      SHIPPING_SERVICE_URL: http://shipping-service:3004
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_PORT: 3004
      BUSINESS_SERVICE_URL: http://business-service:3002
      BUSINESS_SERVICE_HOST: business-service
      BUSINESS_SERVICE_PORT: 3002
      BUSINESS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_business?schema=public
      CHECKOUT_SESSION_TTL_MINUTES: ${CHECKOUT_SESSION_TTL_MINUTES:-15}
      CHECKOUT_SHIPPING_BASE_FEE: ${CHECKOUT_SHIPPING_BASE_FEE:-25000}
      BOOK_COVER_MAX_BYTES: ${BOOK_COVER_MAX_BYTES:-5242880}
      BOOK_PDF_MAX_BYTES: ${BOOK_PDF_MAX_BYTES:-104857600}
      ORDER_PAYMENT_TTL_SECONDS: ${ORDER_PAYMENT_TTL_SECONDS:-900}
      MERCHANT_DISPATCH_DEADLINE_HOURS: ${MERCHANT_DISPATCH_DEADLINE_HOURS:-48}
      AUTO_CANCEL_ON_DISPATCH_TIMEOUT: ${AUTO_CANCEL_ON_DISPATCH_TIMEOUT:-true}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-10}
      PLATFORM_VOUCHER_SUBSIDY_RATE: ${PLATFORM_VOUCHER_SUBSIDY_RATE:-100}
      SHIPPING_PRICING_MODEL: ${SHIPPING_PRICING_MODEL:-TIERED}
      FEATURE_COIN_ENABLED: ${FEATURE_COIN_ENABLED:-true}
      COMMISSION_CALCULATION_BASIS: ${COMMISSION_CALCULATION_BASIS:-NET_SALES}
      VAT_INVOICE_MODE: ${VAT_INVOICE_MODE:-ENABLED}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_commerce?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-token-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - huki-network

  shipping-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-shipping-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/shipping-service/apps/shipping-service/src/main.js"]
    environment:
      PORT: 3004
      SHIPPING_SERVICE_PORT: 3004
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: huki_shipping
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_shipping?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-token-key}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - huki-network

  community-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-community-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/community-service/apps/community-service/src/main.js"]
    environment:
      PORT: 3005
      COMMUNITY_SERVICE_PORT: 3005
      MONGODB_URI: mongodb://mongo:27017/community_db
      COMMERCE_SERVICE_URL: http://commerce-service:3003
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-token-key}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - huki-network

  promotion-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-promotion-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/promotion-service/apps/promotion-service/src/main.js"]
    environment:
      PORT: 3007
      PROMOTION_SERVICE_PORT: 3007
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: huki_promotion
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_promotion?schema=public
      BUSINESS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_business?schema=public
      COMMERCE_SERVICE_URL: http://commerce-service:3003
      COMMERCE_SERVICE_HOST: commerce-service
      COMMERCE_SERVICE_PORT: 3003
      BUSINESS_SERVICE_URL: http://business-service:3002
      IDENTITY_SERVICE_URL: http://identity-service:3001
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-token-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest123}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - huki-network

  analytics-service:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: huki-analytics-service
    restart: unless-stopped
    command: ["node", "dist/out-tsc/analytics-service/apps/analytics-service/src/main.js"]
    environment:
      PORT: 3008
      ANALYTICS_SERVICE_PORT: 3008
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: huki_analytics
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/huki_analytics?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production-refresh-token-key}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-huki-production-internal-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - huki-network

  # ============================================
  # FRONTEND WEB APPLICATION
  # ============================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: huki-web
    restart: unless-stopped
    environment:
      PORT: 3100
      API_GATEWAY_URL: http://api-gateway:3000
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://hukiebook.duckdns.org}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://hukiebook.duckdns.org}
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health?probe=live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - huki-network

networks:
  huki-network:
    name: huki-network

volumes:
  postgres_data:
    name: huki-postgres-data
  mongo_data:
    name: huki-mongo-data
  redis_data:
    name: huki-redis-data
  rabbitmq_data:
    name: huki-rabbitmq-data
